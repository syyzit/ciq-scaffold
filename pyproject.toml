[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ciq-scaffold"
version = "0.1.0"
description = "Generate a starter Garmin Connect IQ project skeleton"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "ciq-scaffold contributors" }]

[project.scripts]
ciq-scaffold = "ciq_scaffold.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
